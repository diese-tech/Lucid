name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete, so cancel it
# rather than paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20. Testing both the floor and current
        # keeps that claim honest — better-sqlite3 is a native module and is the
        # most likely thing to break across Node versions.
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a run can
      # never silently pick up a different dependency version than a developer has.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Coverage instrumentation adds negligible overhead over a plain test
      # run, so this replaces `npm test` rather than running the suite twice.
      # The text reporter prints the summary table straight into this log;
      # the html report is uploaded below so it's actually browsable.
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        # One matrix leg's report is enough; uploading from both Node
        # versions would just be the same numbers twice under different names.
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Catches anything that typechecks but fails to emit — and proves the
      # exact command Railway runs on deploy still works.
      - name: Build
        run: npm run build
